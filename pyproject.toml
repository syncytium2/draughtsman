[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# THE DISTRIBUTION NAME IS NOT THE IMPORT NAME, AND THAT IS DELIBERATE.
# PyPI's `draughtsman` is Kyle Fuller's API Blueprint parser (0.2.0, last released
# 2020-03-26), so this project cannot upload under it and `pip install draughtsman`
# fetches someone else's package. Only the name pip is given changes: the import
# package, the console script and the repository all keep the spelling.
#
# It is now stated in three files -- here, `README.md`, and `cli.py`'s no-torch
# hint -- so `tests/test_dist_name.py` ties them together. A name kept in three
# places and checked in none is DECISIONS.md correction 5, and the hint in cli.py
# had already gone wrong: it told a reader to install the other package.
name = "draughtsman-nn"
version = "0.1.0"
description = "Readable architecture diagrams for PyTorch models: the tracer supplies the facts, an agent supplies the abstraction, and a coverage check proves nothing was silently dropped."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = []

# torch is NOT a hard dependency, and there is no system binary anywhere. `render`
# and `check` operate on graph.json and spec.json alone -- layout is ours (see
# draughtsman/layout.py) -- so a machine that only draws a figure needs neither
# torch nor a GPU wheel nor graphviz. Only `trace` needs anything at all.
#
# This is what lets the staleness test of SPEC.md §6 be an unconditional assertion
# instead of one that skips when a tool is absent.
[project.optional-dependencies]
trace = ["torch>=2.0"]
dev = ["pytest>=8", "torch>=2.0"]

[project.scripts]
draughtsman = "draughtsman.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/draughtsman"]
# ui.html is served verbatim by `draughtsman ui`; it is not a build artifact and
# there is no bundler step, so it has to travel with the package.
artifacts = ["src/draughtsman/ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning:torch.*"]
