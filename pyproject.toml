[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One version, read from the module that already had to declare it.
[tool.hatch.version]
path = "src/draughtsman/__init__.py"

[project]
# THE DISTRIBUTION NAME IS NOT THE IMPORT NAME, AND THAT IS DELIBERATE.
# PyPI's `draughtsman` is Kyle Fuller's API Blueprint parser (0.2.0, last released
# 2020-03-26), so this project cannot upload under it and `pip install draughtsman`
# fetches someone else's package. Only the name pip is given changes: the import
# package, the console script and the repository all keep the spelling.
#
# It is now stated in three files -- here, `README.md`, and `cli.py`'s no-torch
# hint -- so `tests/test_dist_name.py` ties them together. A name kept in three
# places and checked in none is DECISIONS.md correction 5, and the hint in cli.py
# had already gone wrong: it told a reader to install the other package.
name = "draughtsman-nn"

# THE VERSION IS NOT WRITTEN HERE, AND THAT IS THE FIX RATHER THAN AN OMISSION.
# It was a literal in this file AND in `src/draughtsman/__init__.py`, which is
# DECISIONS.md correction 5 in the one place it is unrecoverable: PyPI accepts a
# version number once, forever, so a copy that has drifted is uploaded under a
# number that can never be corrected or replaced. The two had already drifted --
# both said 0.1.0 while the tags and GitHub releases were at v0.1.1, and v0.1.1's
# own tagged tree said 0.1.0 as well.
#
# `__init__.py` is the surviving copy because it is the executed one: it is what
# `draughtsman --version` prints and what an importer reads. Hatchling reads it
# from there, so a build cannot disagree with the running program.
dynamic = ["version"]
description = "Readable architecture diagrams for PyTorch models: the tracer supplies the facts, a person or an agent supplies the abstraction, and a coverage check proves nothing was silently dropped."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = []
keywords = ["pytorch", "architecture diagram", "neural network", "visualization",
            "figure", "svg", "reproducible"]
# THE BROWSE FILTERS. 0.1.2 shipped with none, so it appeared under no topic,
# no licence and no Python version on pypi.org. These are the ones that are
# true; the Python versions are the ones CI runs, see tests/test_versions.py.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]

# torch is NOT a hard dependency, and there is no system binary anywhere. `render`
# and `check` operate on graph.json and spec.json alone -- layout is ours (see
# draughtsman/layout.py) -- so a machine that only draws a figure needs neither
# torch nor a GPU wheel nor graphviz. Only `trace` needs anything at all.
#
# This is what lets the staleness test of SPEC.md §6 be an unconditional assertion
# instead of one that skips when a tool is absent.
# THE URLS PyPI SHOWS, AND THE ONE THAT MAKES THE README WORK THERE.
#
# PyPI renders `readme` as a standalone page with no repository around it, so
# every RELATIVE link in README.md — nine documents and three images — resolved
# against pypi.org and died. They are absolute now, and `Repository` below is the
# base they are built from. That makes the repository URL a quantity kept in two
# places, so `tests/test_readme_links.py` ties them: a link that does not use
# this URL, or that points at a file this repository does not have, fails.
[project.urls]
Homepage = "https://draughtsman.tonydefazio.com"
Repository = "https://github.com/syncytium2/draughtsman"
Issues = "https://github.com/syncytium2/draughtsman/issues"
Changelog = "https://github.com/syncytium2/draughtsman/commits/main"

# VERSION POLICY, STATED SO IT IS NOT INVENTED LATER.
#
# 0.x: the `graph.json` and `spec.json` shapes may change, and a change to either
# is a MINOR bump with the migration written in the commit message. Committed
# specs in `examples/` are re-rendered in the same commit, so the gallery is the
# migration test rather than a document about one.
#
# The three verbs (`trace`, `abstract`, `render`) and their file contract are what
# 1.0 will freeze. Nothing is frozen before it.

[project.optional-dependencies]
trace = ["torch>=2.0"]
dev = ["pytest>=8", "torch>=2.0"]

[project.scripts]
draughtsman = "draughtsman.cli:main"

# WHAT AN SDIST IS FOR, AND WHAT IT IS NOT.
#
# hatchling's sdist takes everything git does not ignore, which shipped this
# repository's own agent hooks -- `.claude/hooks/*.py`, about 40 KB of session
# tooling -- inside `draughtsman_nn-0.1.2.tar.gz`. They are configuration for
# working ON this project, not part of it, and a PyPI version cannot be replaced
# once uploaded: 0.1.2 carries them permanently and this takes them out of the
# next one.
#
# THE EXAMPLES AND TESTS STAY, AND DELIBERATELY. The sdist is 2 MB, and 1.7 MB of
# that is evidence: the PNGs of what five other tools drew, and torchview's graph
# of Whisper. Cutting them would halve the archive and break the tests that ship
# beside them -- `test_readme_links` asserts every README link points at a path
# this repository HAS, and those images are what it points at. An sdist whose
# tests cannot run is a worse object than a large one.
#
# AND 0.1.2 ALSO SHIPPED A PAPER THAT IS NOT OURS. `lit/` holds a 1.3 MB PDF of
# von der Malsburg and Schneider (1986), kept here while the cocktail-party work
# was being handed off; redistributing it through PyPI was never the intent.
# It leaves the sdist along with the notes around it, the experiment that read
# them, the test that reads the PDF (its subject goes with it), the board, and
# the site's domain file. Nothing the remaining tests read is in this list.
[tool.hatch.build.targets.sdist]
exclude = [".claude", "lit", "experiments", "tests/test_cocktail.py", "CNAME"]

[tool.hatch.build.targets.wheel]
packages = ["src/draughtsman"]
# ui.html is served verbatim by `draughtsman ui`; it is not a build artifact and
# there is no bundler step, so it has to travel with the package.
artifacts = ["src/draughtsman/ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning:torch.*"]
