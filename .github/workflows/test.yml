name: tests

on:
  # EVERY BRANCH, NOT JUST main — otherwise this is a post-mortem, not a gate.
  #
  # Sessions here push a branch and then fast-forward main onto it, so a filter
  # of [main] means the first run happens after the code is already on main.
  # `f7540b0` broke main at 13:16 and it stayed broken for six hours, through two
  # further pushes by two sessions, because nobody's local run could see it: the
  # failure was a missing numpy that every machine here happens to have. Running
  # on the branch push means the session that broke it sees it before promoting
  # it, in the same minute as the change.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is whatever pyproject claims. Publishing a `requires-python`
        # nobody has run is a claim, not a fact.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # fetch-depth: 0, AND THE REASON IS NOT HISTORY.
      #
      # The default is a shallow, single-branch fetch, which gives the checkout
      # `main` and `origin/main` and nothing else. `tests/test_claims.py` resolves
      # a claim's branch against the refs it can see, so under the default EVERY
      # landed claim names a branch that "does not exist" and `main` goes red --
      # run 33692848373, 2026-09-02 22:57, on the commit `Claim: marks on tube`.
      # It went green again when the work landed, which is why nobody chased it.
      #
      # CLAIMS.md rule 2 says land the claim on `main` BEFORE the work. Following
      # the rule was what broke the build, so the rule was unfollowable and the
      # board's own check was the thing enforcing that. This is the environment
      # the check needs in order to see what it checks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # UNPINNED, AND THAT IS A GAP THE README NOW STATES RATHER THAN HIDES.
      # This installs whatever torch is current, so the fact-for-fact
      # reproduction in tests/test_reproduces.py is exercised against ONE torch
      # version, four times over — once per Python. The README used to say the
      # property holds "on any" torch; nothing here measures that. Earning the
      # stronger sentence means adding a torch dimension with two or three
      # minors, and it is not a one-line change: the minors do not span 3.10 to
      # 3.13 uniformly, so the matrix needs `exclude:` entries as well.
      #
      # The CPU wheel, not the default CUDA build: only `trace` needs torch and
      # nothing here needs a GPU.
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # DRAUGHTSMAN_NO_SKIPS turns a skipped test into a failed run. `render` and
      # `check` need neither torch nor a system binary precisely so that nothing
      # in this suite has an excuse to go quiet, and this is what holds that to
      # it: a skip is what silence looks like when it is being careful.
      - name: test
        env:
          DRAUGHTSMAN_NO_SKIPS: "1"
        run: pytest -q

      # The figures are committed artifacts (SPEC.md §6). The suite already
      # asserts this; running it again through the CLI a person would actually
      # type checks the same property by the route they would use.
      - name: every committed figure is current
        run: |
          set -euo pipefail
          for spec in examples/*/spec.json examples/*/*/spec.json; do
            dir=$(dirname "$spec")
            draughtsman check "$spec"
            draughtsman render "$spec" -o /tmp/figure.svg
            if ! diff -q /tmp/figure.svg "$dir/figure.svg" > /dev/null; then
              echo "::error file=$dir/figure.svg::stale — re-run draughtsman render and commit it"
              exit 1
            fi
          done

      # THE MARKS ARE COMMITTED ARTIFACTS TOO, AND NOTHING RE-RENDERED THEM.
      # The step above has held every figure since figures were committed; the
      # icons went in beside them held by nothing, and `tube`'s promptly moved
      # 0.15x -> 0.20x when its `layout.wrap` changed for an unrelated banner.
      # A person caught that by comparing against a contact sheet on a Dropbox
      # mount, which is not a check.
      #
      # THE SLOT COMES OUT OF THE FILE. Each mark declares the size it was
      # fitted to, so this needs no constant of its own to keep in step with
      # the artifacts, and a mark committed at some other slot is still held.
      - name: every committed mark is current
        run: |
          set -euo pipefail
          for icon in examples/*/icon.svg examples/*/*/icon.svg; do
            [ -f "$icon" ] || continue
            dir=$(dirname "$icon")
            slot=$(sed -n 's/^<svg width="\([0-9.]*\)" height="\([0-9.]*\)".*/\1x\2/p' "$icon" | head -1)
            if [ -z "$slot" ]; then
              echo "::error file=$icon::does not declare the slot it was fitted to"
              exit 1
            fi
            draughtsman render "$dir/spec.json" --icon "$slot" -o /tmp/icon.svg
            if ! diff -q /tmp/icon.svg "$icon" > /dev/null; then
              echo "::error file=$icon::stale — re-run draughtsman render --icon $slot and commit it"
              exit 1
            fi
          done
