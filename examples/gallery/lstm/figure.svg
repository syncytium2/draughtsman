<svg xmlns="http://www.w3.org/2000/svg" class="draughtsman" role="img" aria-label="BiLSTM tagger — the floor from below" viewBox="0 0 922.56 198" width="922.56" height="198">
<title>BiLSTM tagger — the floor from below</title>
<desc>BiLSTM tagger — the floor from below: 6 stages over 6 traced operations, 120425 parameters.</desc>
<defs><marker id="ds-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L8 4 L0 7.4 Z" style="fill:currentColor"/></marker></defs>
<text class="ds-title" x="12" y="15" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:currentColor">BiLSTM tagger — the floor from below</text>
<text class="ds-subtitle" x="12" y="29" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10px;fill:currentColor;opacity:0.62">120425 parameters · 1×40 tokens in, 1×40×9 out</text>
<g class="ds-body" transform="translate(0 36)">
<path class="ds-edge ds-edge-solid" data-from="tokens" data-to="embed" d="M92 51.25 C119 51.25 119 51.25 146 51.25" style="fill:none;stroke:currentColor;stroke-width:1.4" marker-end="url(#ds-arrow)"/>
<path class="ds-edge ds-edge-dashed" data-from="embed" data-to="state" d="M232.93 51.25 C259.93 51.25 259.93 51.25 286.93 51.25" style="fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:5 3" marker-end="url(#ds-arrow)"/>
<path class="ds-edge ds-edge-solid" data-from="embed" data-to="lstm" d="M232.93 51.25 C288.02 51.25 288.02 106 343.11 106 C398.2 106 398.2 51.25 453.29 51.25" style="fill:none;stroke:currentColor;stroke-width:1.4" marker-end="url(#ds-arrow)"/>
<path class="ds-edge ds-edge-dashed" data-from="state" data-to="lstm" d="M399.29 51.25 C426.29 51.25 426.29 51.25 453.29 51.25" style="fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:5 3" marker-end="url(#ds-arrow)"/>
<path class="ds-edge ds-edge-solid" data-from="lstm" data-to="drop" d="M582.61 51.25 C609.61 51.25 609.61 51.25 636.61 51.25" style="fill:none;stroke:currentColor;stroke-width:1.4" marker-end="url(#ds-arrow)"/>
<path class="ds-edge ds-edge-solid" data-from="drop" data-to="tags" d="M712.61 51.25 C739.61 51.25 739.61 51.25 766.61 51.25" style="fill:none;stroke:currentColor;stroke-width:1.4" marker-end="url(#ds-arrow)"/>
<g class="ds-stage ds-kind-input" data-stage="tokens"><rect x="16" y="28.5" width="76" height="45.5" rx="4" style="fill:#f2f2f0;stroke:#8a8a86;stroke-width:1.2"/><text x="54" y="49.5" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">token ids</text><text x="54" y="62" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">1×40</text></g>
<g class="ds-stage ds-kind-op" data-stage="embed"><rect x="146" y="22.25" width="86.93" height="58" rx="4" style="fill:#f0f0ef;stroke:#8a8a86;stroke-width:1.2"/><text x="189.46" y="43.25" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">embedding</text><text x="189.46" y="55.75" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">32-dim</text><text x="189.46" y="68.25" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">32000 params</text></g>
<g class="ds-stage ds-kind-op" data-stage="state"><rect x="286.93" y="28.5" width="112.37" height="45.5" rx="4" style="fill:#f0f0ef;stroke:#8a8a86;stroke-width:1.2"/><text x="343.11" y="49.5" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">zero initial state</text><text x="343.11" y="62" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">4×1×48, h and c</text></g>
<g class="ds-stage ds-kind-stack" data-stage="lstm"><rect x="453.29" y="16" width="129.32" height="70.5" rx="4" style="fill:#d1e4d9;stroke:#5a8a71;stroke-width:1.2"/><text x="517.95" y="37" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">bidirectional LSTM</text><text x="517.95" y="49.5" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">2 layers, bidirectional</text><text x="517.95" y="62" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">87552 params</text><text x="517.95" y="74.5" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">1×40×96</text></g>
<g class="ds-stage ds-kind-op" data-stage="drop"><rect x="636.61" y="28.5" width="76" height="45.5" rx="4" style="fill:#f0f0ef;stroke:#8a8a86;stroke-width:1.2"/><text x="674.61" y="49.5" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">dropout</text><text x="674.61" y="62" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">p = 0.3</text></g>
<g class="ds-stage ds-kind-output" data-stage="tags"><rect x="766.61" y="22.25" width="139.94" height="58" rx="4" style="fill:#f2f2f0;stroke:#8a8a86;stroke-width:1.2"/><text x="836.59" y="43.25" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">per-token tag scores</text><text x="836.59" y="55.75" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">9 tags</text><text x="836.59" y="68.25" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">873 params</text></g>
</g>
<text class="ds-caption" x="12" y="174" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">The opposite of tube's problem. Most of this model's parameters sit in a single fused operation, so there is almost nothing for stage 2 to judge. This is also the one model here that still draws its leading</text>
<text class="ds-caption" x="12" y="187" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">axis: 4 on the initial state is layers × directions, not a batch, so declaring batch_axis would delete it and check refuses.</text>
</svg>
