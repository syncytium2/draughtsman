<text class="ds-caption" x="12" y="292" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">The opposite of tube's problem. Most of this model's parameters sit in a single fused operation, so there is almost nothing for stage 2 to judge.</text>
<text class="ds-caption" x="12" y="305" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">This is also the one model here that still draws its leading axis: 4 on the initial state is layers × directions, not a batch, so declaring batch_axis</text>
<text class="ds-caption" x="12" y="318" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">would delete it and check refuses.</text>
