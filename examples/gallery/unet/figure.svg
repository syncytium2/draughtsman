<g class="ds-legend">
<rect class="ds-legend-glyph" x="12" y="290.69" width="9" height="8" style="fill:currentColor;fill-opacity:0.42"/>
<text class="ds-legend-label" x="27" y="298.19" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:600;fill:currentColor">channels × height × width</text>
<text class="ds-legend-share" x="146.63" y="298.19" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:currentColor;opacity:0.62">deepest = 128, tallest = 64, widest = 64 · each edge ∝ value · sheets are drawn only where they separate; past 14 the stack is one slab carrying its count</text>
</g>
<text class="ds-caption" x="12" y="314.19" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:currentColor;opacity:0.62">Three skips, each spanning the full depth. A ranked left-to-right layout gets the topology right and cannot produce the U readers expect — so the glyphs carry it instead. Each stage is drawn as its channels × height × width on one shared scale, so equal values are equal lengths: the face is the spatial map and the depth is the channel count. Where a stack is too deep to</text>
<text class="ds-caption" x="12" y="327.19" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:currentColor;opacity:0.62">separate it becomes one solid of the same depth carrying its count, and the key states the ceiling. The volume is the U. It runs 65536, 32768, 16384, 8192 and back — halving into the bottleneck and doubling out of it — and it is invisible in any two of the three axes: channels times height alone is 1024 at every encoder and decoder stage, so the figure this replaces reported</text>
<text class="ds-caption" x="12" y="340.19" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:currentColor;opacity:0.62">the architecture as unchanging.</text>
</svg>
