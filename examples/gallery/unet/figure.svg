<g class="ds-legend">
<rect class="ds-legend-glyph" x="12" y="303.44" width="9" height="8" style="fill:currentColor;fill-opacity:0.42"/>
<text class="ds-legend-label" x="27" y="310.94" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.0px;font-weight:600;fill:currentColor">channels × height × width</text>
<text class="ds-legend-share" x="140.65" y="310.94" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.0px;fill:currentColor;opacity:0.62">deepest = 128, tallest = 64, widest = 64 · each edge ∝ value · a slab means more than 12 sheets, counted beside it</text>
</g>
<text class="ds-caption" x="12" y="327.44" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">Three skips, each spanning the full depth. A ranked left-to-right layout gets the topology right and cannot produce the U readers expect — so the glyphs carry it instead. Each stage is drawn as its channels × height × width: the face is the spatial map, the depth is the channel count, and past twelve channels the stack is one slab with its count, because sheets that occlude each other stop</text>
<text class="ds-caption" x="12" y="340.44" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">being countable long before marks do. The volume is the U. It runs 65536, 32768, 16384, 8192 and back — halving into the bottleneck and doubling out of it — and it is invisible in any two of the three axes: channels times height alone is 1024 at every encoder and decoder stage, so the figure this replaces reported the architecture as unchanging.</text>
</svg>
