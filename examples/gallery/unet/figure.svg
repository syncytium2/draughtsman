<text class="ds-caption" x="12" y="311.44" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">Three skips, each spanning the full depth. A ranked left-to-right layout gets the topology right and cannot produce the U readers expect — so the glyphs carry it instead. Channels times height is the same at every encoder and decoder stage, so each rectangle keeps its area and only turns: wide and flat at full resolution, tall and narrow at the bottleneck, and back again. The U is in the</text>
<text class="ds-caption" x="12" y="324.44" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">encoding, not the layout.</text>
