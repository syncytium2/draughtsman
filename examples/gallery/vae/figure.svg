<svg xmlns="http://www.w3.org/2000/svg" class="draughtsman" role="img" aria-label="Convolutional VAE" viewBox="0 0 1340.82 292.37" width="1340.82" height="292.37">
<title>Convolutional VAE</title>
<desc>Convolutional VAE: 10 stages over 18 traced operations, 52481 parameters.</desc>
