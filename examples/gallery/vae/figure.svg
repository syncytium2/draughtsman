<text class="ds-caption" x="12" y="284.37" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">A fork into two sibling heads and a rejoin that takes in a tensor from outside the graph. Coverage checks that every operation is placed; it does not check that the edges drawn are the edges traced.</text>
</svg>
