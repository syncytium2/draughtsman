<g class="ds-stage ds-kind-op" data-stage="lift"><rect x="809" y="31.36" width="136.42" height="58" rx="4" style="fill:#f0f0ef;stroke:#8a8a86;stroke-width:1.2"/><text x="877.2" y="52.36" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">project and reshape</text><text x="877.2" y="64.86" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">1×32×7×7</text><text x="877.2" y="77.36" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">14112 params</text></g>
