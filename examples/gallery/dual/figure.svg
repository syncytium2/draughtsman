<text class="ds-caption" x="12" y="285.28" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">The family draughtsman was designed against: two parallel branches over one input, rejoining at a concat. Here the fan-out IS in the traced graph, unlike tube's kernel bank.</text>
