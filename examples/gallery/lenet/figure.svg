<text class="ds-caption" x="12" y="150.5" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:#5b5b5b">Every operation here is a registered module, so a module enumerator gets this one right. The interest is that the figure is no worse for being derived from the trace.</text>
