<g class="ds-stage ds-kind-input" data-stage="window"><rect x="43" y="32" width="97.92" height="70.5" rx="4" style="fill:#f2f2f0;stroke:#8a8a86;stroke-width:1.2"/><text x="91.96" y="53" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">ΔF/F window</text><text x="91.96" y="65.5" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">64 frames</text><text x="91.96" y="78" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">64×1</text><text x="91.96" y="90.5" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">frames × neurons</text></g>
