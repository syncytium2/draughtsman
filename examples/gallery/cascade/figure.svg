<text class="ds-legend-share" x="95.55" y="349.5" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.0px;fill:currentColor;opacity:0.62">tallest = 50, widest = 34 · each edge ∝ value</text>
</g>
<text class="ds-caption" x="12" y="366" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">Transcribed from CascadeTorch's define_model at the shipped defaults. Every pretrained CASCADE model — Global_EXC_10Hz_50ms</text>
<text class="ds-caption" x="12" y="379" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">among them — is this same network; they differ in training set, frame rate and target smoothing, not in layers.</text>
</svg>
