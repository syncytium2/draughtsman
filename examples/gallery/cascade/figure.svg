<svg xmlns="http://www.w3.org/2000/svg" class="draughtsman" role="img" aria-label="CASCADE — spike inference from calcium imaging" viewBox="0 0 645.54 390" width="645.54" height="390">
<title>CASCADE — spike inference from calcium imaging</title>
<desc>CASCADE — spike inference from calcium imaging: 8 stages over 14 traced operations, 34381 parameters.</desc>
