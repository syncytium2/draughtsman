<text class="ds-caption" x="12" y="281" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10.0px;fill:currentColor;opacity:0.62">Transcribed from CascadeTorch's define_model at the shipped defaults. Every pretrained CASCADE model — Global_EXC_10Hz_50ms among them — is this same network; they differ in training set, frame rate and target smoothing, not in layers.</text>
