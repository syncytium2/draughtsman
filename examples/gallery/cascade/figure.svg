<g class="ds-stage ds-kind-conv" data-stage="conv3"><rect x="43" y="178.5" width="98.97" height="102.5" rx="4" style="fill:#e2eee7;stroke:#6f9c85;stroke-width:1.2"/><text x="92.49" y="199.5" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">short filter</text><text x="92.49" y="212" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">50 filters, kernel 5</text><text x="92.49" y="224.5" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">→ 4 frames</text><text x="92.49" y="237" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">10050 params</text><rect class="ds-glyph" x="89.78" y="243" width="5.41" height="26" style="fill:#6f9c85;fill-opacity:0.5;stroke:#6f9c85;stroke-width:0.6"/></g>
<g class="ds-stage ds-kind-pool" data-stage="pool2"><rect x="195.97" y="184.75" width="76.31" height="90" rx="4" style="fill:#e4eef5;stroke:#6f93a8;stroke-width:1.2"/><text x="234.13" y="205.75" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:12.0px;font-weight:600;fill:#1a1a1a">max-pool</text><text x="234.13" y="218.25" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">stride 2</text><text x="234.13" y="230.75" text-anchor="middle" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:9.5px;fill:#5b5b5b">→ 2 frames</text><rect class="ds-glyph" x="232.77" y="236.75" width="2.71" height="26" style="fill:#6f93a8;fill-opacity:0.5;stroke:#6f93a8;stroke-width:0.6"/></g>
