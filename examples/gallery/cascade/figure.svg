<text class="ds-subtitle" x="12" y="29" style="font-family:Helvetica Neue, Helvetica, Arial, sans-serif;font-size:10px;fill:currentColor;opacity:0.62">34381 parameters · one 64-frame ΔF/F window in, one spike rate out</text>
